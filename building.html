<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Гараж + Баня — Архитектурный проект</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #1a1a2e; color: #e0e0e0; }
header { background: #16213e; padding: 12px 20px; display: flex; align-items: center; gap: 20px; border-bottom: 2px solid #0f3460; }
header h1 { font-size: 1.1em; color: #e94560; white-space: nowrap; }
nav { display: flex; gap: 8px; }
nav button { padding: 8px 18px; border: 1px solid #0f3460; background: #0f3460; color: #a0aec0; border-radius: 4px; cursor: pointer; font-size: 0.9em; transition: all 0.2s; }
nav button.active { background: #e94560; color: white; border-color: #e94560; }
nav button:hover:not(.active) { background: #1a4a7a; color: white; }
.tab-content { display: none; padding: 20px; }
.tab-content.active { display: flex; justify-content: center; align-items: flex-start; }
#tab-view3d.active { padding: 0; }
canvas { background: white; border-radius: 4px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
#threejs-container { width: 100%; height: calc(100vh - 58px); }
</style>
</head>
<body>
<header>
  <h1>🏗 Гараж + Баня — Архитектурный проект</h1>
  <nav>
    <button id="btn-floorplan" class="active" onclick="showTab('floorplan')">📐 План этажа</button>
    <button id="btn-facades" onclick="showTab('facades')">🏠 Фасады</button>
    <button id="btn-view3d" onclick="showTab('view3d')">🧊 3D вид</button>
  </nav>
</header>

<div id="tab-floorplan" class="tab-content active">
  <canvas id="floorplan-canvas" width="900" height="720"></canvas>
</div>

<div id="tab-facades" class="tab-content">
  <canvas id="facades-canvas" width="900" height="800"></canvas>
</div>

<div id="tab-view3d" class="tab-content">
  <div id="threejs-container"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ============================================================
// TAB SWITCHING
// ============================================================
let threeInitialized = false;
function showTab(name) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.getElementById('btn-' + name).classList.add('active');
  if (name === 'floorplan') drawFloorPlan();
  if (name === 'facades') drawFacades();
  if (name === 'view3d' && !threeInitialized) { init3D(); threeInitialized = true; }
}

// ============================================================
// FLOOR PLAN
// ============================================================
function drawFloorPlan() {
  const canvas = document.getElementById('floorplan-canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  // Scale: 1m = 100px, origin offset
  const S = 100; // px per meter
  const OX = 130, OY = 80; // origin (NW corner of garage in canvas coords)

  // Building: Garage 3x5m (left), Sauna 3x3m (right)
  // Coordinate: x=right(east), y=down(south)
  // Garage: (0,0)-(3,5), Sauna: (3,0)-(6,3)
  // Canvas coords: canvasX = OX + x*S, canvasY = OY + y*S

  const cx = (x) => OX + x * S;
  const cy = (y) => OY + y * S;

  // Background
  ctx.fillStyle = '#f8f8f8';
  ctx.fillRect(0, 0, W, H);

  // ---- GRID (50cm = S/2 px) ----
  ctx.strokeStyle = '#e0e0e0';
  ctx.lineWidth = 0.5;
  const gridStep = S / 2;
  for (let x = OX % gridStep; x < W; x += gridStep) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = OY % gridStep; y < H; y += gridStep) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  // ---- BUILDING OUTLINE (L-shape) ----
  // L-shape perimeter: (0,0)→(3,0)→(3,2)→(6,2)→(6,5)→(0,5)→(0,0)
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 3;
  ctx.fillStyle = '#fff9e6';
  ctx.beginPath();
  ctx.moveTo(cx(0), cy(0));
  ctx.lineTo(cx(3), cy(0));
  ctx.lineTo(cx(3), cy(2));
  ctx.lineTo(cx(6), cy(2));
  ctx.lineTo(cx(6), cy(5));
  ctx.lineTo(cx(0), cy(5));
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // ---- INTERIOR WALLS ----
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2.5;
  // Wall between garage and sauna (vertical at x=3, from y=2 to y=5)
  ctx.beginPath(); ctx.moveTo(cx(3), cy(2)); ctx.lineTo(cx(3), cy(5)); ctx.stroke();
  // Sauna internal walls
  // Horizontal: y=2.8 from x=3 to x=6 (separates Санузел from Моечная)
  ctx.beginPath(); ctx.moveTo(cx(3), cy(3.4)); ctx.lineTo(cx(6), cy(3.4)); ctx.stroke();
  // Horizontal: y=4.1 from x=3 to x=6 (separates Моечная from Парилка)
  ctx.beginPath(); ctx.moveTo(cx(3), cy(4.1)); ctx.lineTo(cx(6), cy(4.1)); ctx.stroke();
  // Vertical in Санузел: x=4.2, y=2 to y=3.4
  ctx.beginPath(); ctx.moveTo(cx(4.2), cy(2)); ctx.lineTo(cx(4.2), cy(3.4)); ctx.stroke();

  // ---- DOORS ----
  function drawDoor(x, y, width, angle, swingAngle, flip) {
    // Door gap in wall (clear the wall line), then draw swing arc
    ctx.save();
    ctx.translate(cx(x), cy(y));
    ctx.rotate(angle);
    // door leaf
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, width * S);
    ctx.stroke();
    // swing arc
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 0.8;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.arc(0, 0, width * S, 0, swingAngle * (flip ? -1 : 1));
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  // Garage main door (ворота): front wall (y=5), centered, 2.2m wide
  // Door at x=0.4, front wall = y=5, open inward (upward in canvas = north)
  // Ворота: draw as double door, x=0.4 to x=2.6
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  ctx.setLineDash([]);
  // Left leaf: from (0.4,5) opening left
  ctx.save();
  ctx.translate(cx(0.4), cy(5));
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0, -1.1*S); ctx.stroke();
  ctx.strokeStyle = '#888'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.arc(0, 0, 1.1*S, -Math.PI/2, 0); ctx.stroke();
  ctx.setLineDash([]); ctx.restore();
  // Right leaf: from (2.6,5)
  ctx.save();
  ctx.translate(cx(2.6), cy(5));
  ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0, -1.1*S); ctx.stroke();
  ctx.strokeStyle = '#888'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.arc(0, 0, 1.1*S, -Math.PI/2, -Math.PI, true); ctx.stroke();
  ctx.setLineDash([]); ctx.restore();
  // White gap for ворота in front wall
  ctx.strokeStyle = '#fff9e6'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(cx(0.4), cy(5)); ctx.lineTo(cx(2.6), cy(5)); ctx.stroke();

  // Sauna external door: front wall, x=3.2, w=0.9m, opens inward
  ctx.save();
  ctx.translate(cx(3.2), cy(5));
  ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0, -0.9*S); ctx.stroke();
  ctx.strokeStyle = '#888'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.arc(0, 0, 0.9*S, -Math.PI/2, 0); ctx.stroke();
  ctx.setLineDash([]); ctx.restore();
  ctx.strokeStyle = '#fff9e6'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(cx(3.2), cy(5)); ctx.lineTo(cx(4.1), cy(5)); ctx.stroke();

  // Internal door garage→sauna (x=3, y=4.3), w=0.8m
  ctx.save();
  ctx.translate(cx(3), cy(4.8));
  ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0.8*S, 0); ctx.stroke();
  ctx.strokeStyle = '#888'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.arc(0, 0, 0.8*S, 0, -Math.PI/2, true); ctx.stroke();
  ctx.setLineDash([]); ctx.restore();
  ctx.strokeStyle = '#fff9e6'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(cx(3), cy(4.8)); ctx.lineTo(cx(3), cy(4.0)); ctx.stroke();

  // Санузел door: x=4.2, y=2.7, opens right
  ctx.save();
  ctx.translate(cx(4.2), cy(2.7));
  ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0, 0.7*S); ctx.stroke();
  ctx.strokeStyle = '#888'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.arc(0, 0, 0.7*S, Math.PI/2, Math.PI); ctx.stroke();
  ctx.setLineDash([]); ctx.restore();
  ctx.strokeStyle = '#fff9e6'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(cx(4.2), cy(2.7)); ctx.lineTo(cx(4.2), cy(3.4)); ctx.stroke();

  // Моечная door: x=3, y=3.7
  ctx.save();
  ctx.translate(cx(3), cy(3.7));
  ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0.8*S, 0); ctx.stroke();
  ctx.strokeStyle = '#888'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.arc(0, 0, 0.8*S, 0, Math.PI/2); ctx.stroke();
  ctx.setLineDash([]); ctx.restore();
  ctx.strokeStyle = '#fff9e6'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(cx(3), cy(3.7)); ctx.lineTo(cx(3), cy(4.5)); ctx.stroke();

  // Парилка door: x=6, y=4.5, opens left (west)
  ctx.save();
  ctx.translate(cx(6), cy(4.5));
  ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-0.8*S, 0); ctx.stroke();
  ctx.strokeStyle = '#888'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.arc(0, 0, 0.8*S, Math.PI, Math.PI/2, true); ctx.stroke();
  ctx.setLineDash([]); ctx.restore();
  ctx.strokeStyle = '#fff9e6'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(cx(6), cy(4.5)); ctx.lineTo(cx(6), cy(3.7)); ctx.stroke();

  // ---- WINDOWS ----
  function drawWindow(x1, y1, x2, y2) {
    ctx.strokeStyle = '#fff9e6'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(cx(x1), cy(y1)); ctx.lineTo(cx(x2), cy(y2)); ctx.stroke();
    ctx.strokeStyle = '#2196F3'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx(x1), cy(y1)); ctx.lineTo(cx(x2), cy(y2)); ctx.stroke();
    const mx = (cx(x1)+cx(x2))/2, my = (cy(y1)+cy(y2))/2;
    const dx = cx(x2)-cx(x1), dy = cy(y2)-cy(y1);
    const len = Math.sqrt(dx*dx+dy*dy);
    const nx = -dy/len*6, ny = dx/len*6;
    ctx.strokeStyle = '#2196F3'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(mx-nx, my-ny); ctx.lineTo(mx+nx, my+ny); ctx.stroke();
  }
  // Garage left wall window: x=0, y=1.5 to y=2.5
  drawWindow(0, 1.5, 0, 2.5);
  // Garage left wall window 2: x=0, y=3 to y=4
  drawWindow(0, 3.0, 0, 4.0);
  // Garage front window: y=5, x=... already have ворота. Small window at x=2.7 to x=2.95? Actually skip for clarity - garage front is mostly doors

  // ---- FURNITURE ----
  // Workbench along garage back wall (north): x=0.2 to x=2.8, y=0 to y=0.6
  ctx.fillStyle = '#d4a373';
  ctx.strokeStyle = '#8B4513';
  ctx.lineWidth = 1.5;
  ctx.fillRect(cx(0.2), cy(0), (2.6)*S, 0.6*S);
  ctx.strokeRect(cx(0.2), cy(0), (2.6)*S, 0.6*S);
  ctx.fillStyle = '#c8956c';
  ctx.fillRect(cx(0.25), cy(0.05), 2.5*S, 0.5*S);
  ctx.fillStyle = '#555'; ctx.font = '11px Arial'; ctx.textAlign = 'center';
  ctx.fillText('Верстак', cx(1.5), cy(0.32));

  // Shelves along garage right wall (x=2.8 to x=3): y=0.7 to y=2.5
  ctx.fillStyle = '#deb887'; ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 1;
  ctx.fillRect(cx(2.7), cy(0.7), 0.3*S, 1.8*S);
  ctx.strokeRect(cx(2.7), cy(0.7), 0.3*S, 1.8*S);
  for (let sh = 0.7; sh <= 2.5; sh += 0.45) {
    ctx.beginPath(); ctx.moveTo(cx(2.7), cy(sh)); ctx.lineTo(cx(3.0), cy(sh)); ctx.stroke();
  }
  ctx.save(); ctx.translate(cx(2.85), cy(1.6)); ctx.rotate(-Math.PI/2);
  ctx.fillStyle = '#555'; ctx.font = '10px Arial'; ctx.textAlign = 'center';
  ctx.fillText('Стеллаж', 0, 4); ctx.restore();

  // Motorcycle outline: x=0.3 to x=1.1 (wide) y=1.2 to y=3.8 (long)
  ctx.strokeStyle = '#666'; ctx.lineWidth = 1.5; ctx.setLineDash([3,3]);
  ctx.strokeRect(cx(0.35), cy(1.3), 0.9*S, 2.4*S);
  ctx.setLineDash([]);
  // wheels
  ctx.beginPath(); ctx.ellipse(cx(0.8), cy(1.65), 0.3*S, 0.15*S, 0, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx(0.8), cy(3.65), 0.3*S, 0.15*S, 0, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = '#888'; ctx.font = '10px Arial'; ctx.textAlign = 'center';
  ctx.fillText('Мотоцикл', cx(0.8), cy(2.5));

  // Sauna furniture
  // Парилка benches: bottom section y=4.1 to y=5, x=3 to x=6
  ctx.fillStyle = '#c8956c'; ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 1;
  // Lower bench
  ctx.fillRect(cx(3.1), cy(4.2), 2.8*S, 0.35*S); ctx.strokeRect(cx(3.1), cy(4.2), 2.8*S, 0.35*S);
  // Upper bench
  ctx.fillRect(cx(3.1), cy(4.6), 2.8*S, 0.35*S); ctx.strokeRect(cx(3.1), cy(4.6), 2.8*S, 0.35*S);
  // Stove (каменка): top-left of парилка
  ctx.fillStyle = '#888'; ctx.strokeStyle = '#555'; ctx.lineWidth = 1.5;
  ctx.fillRect(cx(3.1), cy(4.15), 0.5*S, 0.5*S); ctx.strokeRect(cx(3.1), cy(4.15), 0.5*S, 0.5*S);
  ctx.fillStyle = '#333'; ctx.font = '9px Arial'; ctx.textAlign = 'center';
  ctx.fillText('Печь', cx(3.35), cy(4.43));

  // Моечная: shower/wash area y=3.4 to 4.1, x=3 to 6
  ctx.strokeStyle = '#2196F3'; ctx.lineWidth = 1; ctx.setLineDash([2,2]);
  ctx.strokeRect(cx(5.0), cy(3.5), 0.9*S, 0.8*S);
  ctx.setLineDash([]); ctx.fillStyle = '#cce5ff';
  ctx.fillRect(cx(5.0), cy(3.5), 0.9*S, 0.8*S);
  ctx.fillStyle = '#555'; ctx.font = '9px Arial'; ctx.textAlign = 'center';
  ctx.fillText('Душ', cx(5.45), cy(3.88));

  // Санузел toilet: x=3 to 4.2, y=2 to 3.4
  ctx.fillStyle = '#e8f5ff'; ctx.strokeStyle = '#2196F3'; ctx.lineWidth = 1;
  ctx.fillRect(cx(3.1), cy(2.15), 0.5*S, 0.7*S); ctx.strokeRect(cx(3.1), cy(2.15), 0.5*S, 0.7*S);
  // toilet seat arc
  ctx.beginPath(); ctx.ellipse(cx(3.35), cy(2.5), 0.22*S, 0.3*S, 0, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = '#555'; ctx.font = '9px Arial';
  ctx.fillText('WC', cx(3.35), cy(2.5));
  // sink
  ctx.fillStyle = '#e8f5ff'; ctx.strokeStyle = '#2196F3';
  ctx.fillRect(cx(3.7), cy(2.1), 0.4*S, 0.35*S); ctx.strokeRect(cx(3.7), cy(2.1), 0.4*S, 0.35*S);
  ctx.beginPath(); ctx.arc(cx(3.9), cy(2.275), 0.08*S, 0, Math.PI*2); ctx.stroke();

  // ---- ROOM LABELS ----
  ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
  ctx.fillStyle = '#1a1a1a';
  ctx.fillText('ГАРАЖ', cx(1.5), cy(2.5));
  ctx.font = '11px Arial'; ctx.fillStyle = '#555';
  ctx.fillText('3.0 × 5.0 м', cx(1.5), cy(2.72));

  ctx.font = 'bold 13px Arial'; ctx.fillStyle = '#1a1a1a';
  ctx.fillText('ПАРИЛКА', cx(4.5), cy(4.62));
  ctx.font = '10px Arial'; ctx.fillStyle = '#555';
  ctx.fillText('3.0×0.9 м', cx(4.5), cy(4.78));

  ctx.font = 'bold 12px Arial'; ctx.fillStyle = '#1a1a1a';
  ctx.fillText('МОЕЧНАЯ', cx(4.5), cy(3.78));
  ctx.font = '10px Arial'; ctx.fillStyle = '#555';
  ctx.fillText('3.0×0.7 м', cx(4.5), cy(3.94));

  ctx.font = 'bold 11px Arial'; ctx.fillStyle = '#1a1a1a';
  ctx.fillText('САНУЗЕЛ', cx(3.6), cy(2.75));
  ctx.font = '10px Arial'; ctx.fillStyle = '#555';
  ctx.fillText('1.2×1.4 м', cx(3.6), cy(2.9));

  // ---- DIMENSION LINES ----
  ctx.strokeStyle = '#333'; ctx.lineWidth = 1; ctx.fillStyle = '#333';
  ctx.font = '11px Arial'; ctx.textAlign = 'center';

  function dimLine(x1, y1, x2, y2, text, offset, horiz) {
    const ox = horiz ? 0 : offset, oy = horiz ? offset : 0;
    ctx.save();
    ctx.strokeStyle = '#333'; ctx.lineWidth = 0.8; ctx.setLineDash([]);
    // extension lines
    ctx.beginPath(); ctx.moveTo(cx(x1), cy(y1)); ctx.lineTo(cx(x1)+ox, cy(y1)+oy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx(x2), cy(y2)); ctx.lineTo(cx(x2)+ox, cy(y2)+oy); ctx.stroke();
    // dim line with arrows
    ctx.beginPath(); ctx.moveTo(cx(x1)+ox, cy(y1)+oy); ctx.lineTo(cx(x2)+ox, cy(y2)+oy); ctx.stroke();
    const mx2 = (cx(x1)+cx(x2))/2+ox, my2 = (cy(y1)+cy(y2))/2+oy;
    ctx.fillStyle = 'white'; ctx.fillRect(mx2-18, my2-7, 36, 14);
    ctx.fillStyle = '#333'; ctx.font = '11px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, mx2, my2);
    ctx.restore();
  }

  // Bottom dimensions
  dimLine(0, 5, 3, 5, '3.0 м', 40, true);
  dimLine(3, 5, 6, 5, '3.0 м', 40, true);
  dimLine(0, 5, 6, 5, '6.0 м', 70, true);

  // Top dimension (garage only)
  dimLine(0, 0, 3, 0, '3.0 м', -35, true);

  // Right side dimensions (sauna)
  dimLine(6, 2, 6, 5, '3.0 м', 45, false);

  // Left side dimensions (garage)
  dimLine(0, 0, 0, 5, '5.0 м', -45, false);

  // Step dims
  dimLine(3, 0, 3, 2, '2.0 м', 45, false);
  dimLine(3, 2, 6, 2, '3.0 м', -35, true);

  // ---- NORTH ARROW ----
  const nx0 = 50, ny0 = 90;
  ctx.save(); ctx.translate(nx0, ny0);
  ctx.strokeStyle = '#333'; ctx.fillStyle = '#333'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, 20); ctx.lineTo(0, -20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(-6, -10); ctx.lineTo(6, -10); ctx.closePath(); ctx.fill();
  ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center'; ctx.fillText('С', 0, 38);
  ctx.restore();

  // ---- LEGEND ----
  const lx = 720, ly = 200;
  ctx.fillStyle = '#f0f0f0'; ctx.strokeStyle = '#aaa'; ctx.lineWidth = 1;
  ctx.fillRect(lx-5, ly-15, 165, 170); ctx.strokeRect(lx-5, ly-15, 165, 170);
  ctx.font = 'bold 12px Arial'; ctx.fillStyle = '#333'; ctx.textAlign = 'left';
  ctx.fillText('Обозначения:', lx, ly);

  const items = [
    { color: '#2196F3', label: 'Окно', type: 'line' },
    { color: '#222', label: 'Дверь / ворота', type: 'line' },
    { color: '#888', label: 'Дуга открытия', type: 'dash' },
    { color: '#d4a373', label: 'Верстак', type: 'rect' },
    { color: '#deb887', label: 'Стеллаж', type: 'rect' },
    { color: '#c8956c', label: 'Полок (парилка)', type: 'rect' },
    { color: '#cce5ff', label: 'Душевая', type: 'rect' },
  ];
  items.forEach((item, i) => {
    const iy = ly + 18 + i * 21;
    ctx.fillStyle = item.type === 'rect' ? item.color : 'transparent';
    if (item.type === 'rect') ctx.fillRect(lx, iy-8, 24, 12);
    ctx.strokeStyle = item.color;
    ctx.lineWidth = item.type === 'dash' ? 1 : 2;
    ctx.setLineDash(item.type === 'dash' ? [4,3] : []);
    ctx.beginPath(); ctx.moveTo(lx, iy); ctx.lineTo(lx+24, iy); ctx.stroke();
    ctx.setLineDash([]); ctx.lineWidth = 1;
    ctx.fillStyle = '#333'; ctx.font = '11px Arial'; ctx.textAlign = 'left';
    ctx.fillText(item.label, lx+30, iy+4);
  });

  // Title block
  ctx.fillStyle = '#f0f4ff'; ctx.strokeStyle = '#aaa'; ctx.lineWidth = 1;
  ctx.fillRect(lx-5, ly+175, 165, 80); ctx.strokeRect(lx-5, ly+175, 165, 80);
  ctx.fillStyle = '#333'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
  ctx.fillText('ПЛАН ЭТАЖА 1:100', lx+77, ly+192);
  ctx.font = '10px Arial';
  ctx.fillText('Гараж + Баня', lx+77, ly+207);
  ctx.fillText('Каркасная конструкция', lx+77, ly+221);
  ctx.fillText('Масштаб 1:100', lx+77, ly+235);
}

// ============================================================
// FACADES
// ============================================================
function drawFacades() {
  const canvas = document.getElementById('facades-canvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#f8f8f8';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 4 facades arranged 2x2
  // Scale: S px/m
  const S = 60;

  // Roof: single slope, garage side (left, west) HIGH, sauna side (right, east) LOW
  // Wall height: 2.5m, roof slope: e.g. extra 0.8m on garage side → garage top = 3.3m, sauna top = 2.5m
  const wallH = 2.5, roofHighExtra = 0.8;
  const garageW = 3, saunaW = 3, garageD = 5, saunaD = 3;
  const totalW = garageW + saunaW; // 6m

  function facade(label, ox, oy, fn) {
    ctx.save();
    ctx.font = 'bold 13px Arial'; ctx.fillStyle = '#1a1a2e'; ctx.textAlign = 'center';
    ctx.fillText(label, ox, oy - 12);
    fn(ox, oy, ctx, S);
    ctx.restore();
  }

  // Helper: draw dimension
  function dim(ctx, x1, y1, x2, y2, text, off) {
    ctx.save();
    ctx.strokeStyle = '#555'; ctx.lineWidth = 0.7; ctx.fillStyle = '#555';
    ctx.font = '10px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // ext lines
    const dx = x2-x1, dy = y2-y1, len = Math.sqrt(dx*dx+dy*dy);
    const nx = -dy/len*off, ny = dx/len*off;
    ctx.setLineDash([2,2]);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x1+nx,y1+ny); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x2+nx,y2+ny); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(x1+nx,y1+ny); ctx.lineTo(x2+nx,y2+ny); ctx.stroke();
    const mx = (x1+x2)/2+nx, my = (y1+y2)/2+ny;
    ctx.fillStyle = '#f8f8f8'; ctx.fillRect(mx-14, my-7, 28, 14);
    ctx.fillStyle = '#333'; ctx.fillText(text, mx, my);
    ctx.restore();
  }

  // ---- FRONT FACADE (Южный) — full 6m wide ----
  facade('ЮЖНЫЙ ФАСАД (главный)', 230, 50, (ox, oy) => {
    const bw = totalW * S; // 360px
    const wallTop = oy + 30;
    const groundY = wallTop + wallH * S; // ground line
    const roofLeftY = wallTop - roofHighExtra * S; // high side (garage left)
    const roofRightY = wallTop; // low side (sauna right) = same as wall top for continuity

    // Ground
    ctx.strokeStyle = '#888'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ox-20, groundY); ctx.lineTo(ox+bw+20, groundY); ctx.stroke();

    // Walls outline
    ctx.fillStyle = '#f5e6c8'; ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    ctx.fillRect(ox, wallTop, bw, wallH*S);
    ctx.strokeRect(ox, wallTop, bw, wallH*S);

    // Roof
    ctx.fillStyle = '#888'; ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(ox, groundY); // bottom-left
    ctx.lineTo(ox, roofLeftY); // top-left (high)
    ctx.lineTo(ox+bw, wallTop); // top-right (low = wall top of sauna)
    ctx.lineTo(ox+bw, groundY); // bottom-right
    ctx.closePath(); ctx.fill(); ctx.stroke();

    // Roof overhang
    ctx.fillStyle = '#6b6b6b'; ctx.strokeStyle = '#444'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(ox-15, roofLeftY);
    ctx.lineTo(ox+bw+15, wallTop-5);
    ctx.lineTo(ox+bw+15, wallTop+5);
    ctx.lineTo(ox-15, roofLeftY+10);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    // Repaint walls over roof base
    ctx.fillStyle = '#f5e6c8'; ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    ctx.fillRect(ox, wallTop, bw, wallH*S);
    ctx.strokeRect(ox, wallTop, bw, wallH*S);

    // Garage door (ворота): x=ox+0.4*S, 2.2m wide, 2.2m tall, centered
    const gdx = ox + 0.4*S, gdw = 2.2*S, gdh = 2.2*S, gdt = groundY - gdh;
    ctx.fillStyle = '#8B4513'; ctx.strokeStyle = '#5D2E0C'; ctx.lineWidth = 1.5;
    ctx.fillRect(gdx, gdt, gdw, gdh); ctx.strokeRect(gdx, gdt, gdw, gdh);
    // Double door lines
    ctx.beginPath(); ctx.moveTo(gdx+gdw/2, gdt); ctx.lineTo(gdx+gdw/2, groundY); ctx.stroke();
    ctx.strokeStyle = '#7a3b0a'; ctx.lineWidth = 1;
    // panels
    for (let p = 0; p < 3; p++) {
      ctx.strokeRect(gdx+4, gdt+4+p*((gdh-8)/3), gdw/2-8, (gdh-8)/3-4);
      ctx.strokeRect(gdx+gdw/2+4, gdt+4+p*((gdh-8)/3), gdw/2-8, (gdh-8)/3-4);
    }
    ctx.strokeStyle = '#333'; ctx.lineWidth = 1;

    // Sauna door: x=ox+3.2*S, w=0.9*S, h=2.0*S
    const sdx = ox + 3.2*S, sdw = 0.9*S, sdh = 2.0*S, sdt = groundY - sdh;
    ctx.fillStyle = '#8B4513'; ctx.strokeStyle = '#5D2E0C'; ctx.lineWidth = 1.5;
    ctx.fillRect(sdx, sdt, sdw, sdh); ctx.strokeRect(sdx, sdt, sdw, sdh);
    ctx.beginPath(); ctx.arc(sdx+sdw/2, sdt+sdh*0.6, 0.05*S, 0, Math.PI*2); ctx.fill();

    // Window left garage side: x=2.7*S, w=0.6*S, h=0.8*S, at mid-height
    const wx = ox+2.7*S, ww = 0.5*S, wh = 0.8*S, wt = wallTop + 0.6*S;
    ctx.fillStyle = '#87CEEB'; ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5;
    ctx.fillRect(wx, wt, ww, wh); ctx.strokeRect(wx, wt, ww, wh);
    ctx.beginPath(); ctx.moveTo(wx+ww/2, wt); ctx.lineTo(wx+ww/2, wt+wh); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(wx, wt+wh/2); ctx.lineTo(wx+ww, wt+wh/2); ctx.stroke();

    // Timber pattern lines (horizontal)
    ctx.strokeStyle = '#c9a96e'; ctx.lineWidth = 0.5;
    for (let h = 0.3; h < wallH; h += 0.3) {
      ctx.beginPath(); ctx.moveTo(ox, wallTop+h*S); ctx.lineTo(ox+bw, wallTop+h*S); ctx.stroke();
    }

    // Labels
    ctx.fillStyle = '#333'; ctx.font = '11px Arial'; ctx.textAlign = 'center';
    ctx.fillText('Ворота 2.2×2.2', ox+1.5*S, groundY+15);
    ctx.fillText('Вх. дверь', ox+3.65*S, groundY+15);

    // Dims
    dim(ctx, ox, groundY, ox+bw, groundY, '6.0 м', 25);
    dim(ctx, ox, wallTop, ox, groundY, '2.5', -25);
    dim(ctx, ox, roofLeftY, ox, wallTop, '0.8', -25);
    dim(ctx, ox, roofLeftY, ox+bw, wallTop, 'Конёк', -45);
  });

  // ---- REAR FACADE (Северный) — garage only 3m wide (sauna doesn't reach rear) ----
  facade('СЕВЕРНЫЙ ФАСАД (тыльный)', 680, 50, (ox, oy) => {
    const bw = garageW * S; // 180px
    const wallTop = oy + 30;
    const groundY = wallTop + wallH * S;
    const roofLeftY = wallTop - roofHighExtra * S;

    ctx.strokeStyle = '#888'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ox-20, groundY); ctx.lineTo(ox+bw+60, groundY); ctx.stroke();

    // L-shape rear: full garage wall 3m, then step
    // Garage rear wall: ox to ox+garageW*S
    ctx.fillStyle = '#f5e6c8'; ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    ctx.fillRect(ox, wallTop, bw, wallH*S); ctx.strokeRect(ox, wallTop, bw, wallH*S);
    // Sauna rear partial: x=3m but only 2.5m wall height showing as step
    ctx.fillRect(ox+bw, wallTop, saunaW*S, wallH*S);
    ctx.strokeRect(ox+bw, wallTop, saunaW*S, wallH*S);

    // Roof
    ctx.fillStyle = '#888'; ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(ox, roofLeftY);
    ctx.lineTo(ox+(garageW+saunaW)*S, wallTop);
    ctx.lineTo(ox+(garageW+saunaW)*S, wallTop+2);
    ctx.lineTo(ox, roofLeftY+2);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    // Timber lines
    ctx.strokeStyle = '#c9a96e'; ctx.lineWidth = 0.5;
    for (let h = 0.3; h < wallH; h += 0.3) {
      ctx.beginPath(); ctx.moveTo(ox, wallTop+h*S); ctx.lineTo(ox+(garageW+saunaW)*S, wallTop+h*S); ctx.stroke();
    }

    // Step line (L-shape visible from rear)
    ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.moveTo(ox+bw, wallTop); ctx.lineTo(ox+bw, groundY); ctx.stroke();
    ctx.setLineDash([]);

    // Window in garage rear wall
    const wx = ox+0.8*S, ww = 0.8*S, wh = 0.8*S, wt = wallTop + 0.6*S;
    ctx.fillStyle = '#87CEEB'; ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5;
    ctx.fillRect(wx, wt, ww, wh); ctx.strokeRect(wx, wt, ww, wh);
    ctx.beginPath(); ctx.moveTo(wx+ww/2, wt); ctx.lineTo(wx+ww/2, wt+wh); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(wx, wt+wh/2); ctx.lineTo(wx+ww, wt+wh/2); ctx.stroke();

    dim(ctx, ox, groundY, ox+bw, groundY, '3.0 м', 25);
    dim(ctx, ox, wallTop, ox, groundY, '2.5', -25);
  });

  // ---- LEFT FACADE (Западный — garage side) 5m deep ----
  facade('ЗАПАДНЫЙ ФАСАД (гараж)', 155, 430, (ox, oy) => {
    const bw = garageD * S; // 300px
    const wallTop = oy + 30;
    const groundY = wallTop + wallH * S;
    // From west: left = front (south), right = back (north)
    // Roof: high on left (=west in real = the left when looking from west is the west wall)
    // Actually from west view: left=north(back), right=south(front)
    // The roof ridge is on the west (garage) side — so the whole west wall is at the HIGH point
    const roofTopY = wallTop - roofHighExtra * S;

    ctx.strokeStyle = '#888'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ox-20, groundY); ctx.lineTo(ox+bw+20, groundY); ctx.stroke();

    ctx.fillStyle = '#f5e6c8'; ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    ctx.fillRect(ox, wallTop, bw, wallH*S); ctx.strokeRect(ox, wallTop, bw, wallH*S);

    // Roof: west wall is at peak, so roof is flat line at top on this view (just the wall peak)
    // Show the gable: since it's mono-pitch, west end is the HIGH end
    // Gable triangle or trapezoid showing roof height
    ctx.fillStyle = '#888'; ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    ctx.fillRect(ox-10, roofTopY, bw+20, 8); ctx.strokeRect(ox-10, roofTopY, bw+20, 8);

    // Windows on west wall (2 windows)
    const positions = [[0.8, 1.0], [2.5, 1.0]];
    positions.forEach(([px, ph]) => {
      const wx = ox+px*S, ww = 0.7*S, wh = 0.7*S, wt = wallTop+ph*S;
      ctx.fillStyle = '#87CEEB'; ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5;
      ctx.fillRect(wx, wt, ww, wh); ctx.strokeRect(wx, wt, ww, wh);
      ctx.beginPath(); ctx.moveTo(wx+ww/2, wt); ctx.lineTo(wx+ww/2, wt+wh); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(wx, wt+wh/2); ctx.lineTo(wx+ww, wt+wh/2); ctx.stroke();
    });

    // Timber lines
    ctx.strokeStyle = '#c9a96e'; ctx.lineWidth = 0.5;
    for (let h = 0.3; h < wallH; h += 0.3) {
      ctx.beginPath(); ctx.moveTo(ox, wallTop+h*S); ctx.lineTo(ox+bw, wallTop+h*S); ctx.stroke();
    }

    dim(ctx, ox, groundY, ox+bw, groundY, '5.0 м', 25);
    dim(ctx, ox, wallTop, ox, groundY, '2.5', -25);
    dim(ctx, ox, roofTopY, ox, wallTop, '0.8', -25);
    ctx.fillStyle = '#555'; ctx.font = '10px Arial'; ctx.textAlign = 'center';
    ctx.fillText('С', ox-30, oy+80); ctx.fillText('Ю', ox+bw+30, oy+80);
  });

  // ---- RIGHT FACADE (Восточный — sauna side) 3m deep ----
  facade('ВОСТОЧНЫЙ ФАСАД (баня)', 620, 430, (ox, oy) => {
    const bw = saunaD * S; // 180px
    const wallTop = oy + 30;
    const groundY = wallTop + wallH * S;
    // East wall is the LOW side of the roof
    const roofTopY = wallTop; // roof meets wall top exactly at low point

    ctx.strokeStyle = '#888'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ox-20, groundY); ctx.lineTo(ox+bw+20, groundY); ctx.stroke();

    ctx.fillStyle = '#f5e6c8'; ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    ctx.fillRect(ox, wallTop, bw, wallH*S); ctx.strokeRect(ox, wallTop, bw, wallH*S);

    // Roof (flat fascia on east = low end)
    ctx.fillStyle = '#888'; ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    ctx.fillRect(ox-10, wallTop-6, bw+20, 8); ctx.strokeRect(ox-10, wallTop-6, bw+20, 8);

    // Small window on east sauna wall
    const wx = ox+0.8*S, ww = 0.5*S, wh = 0.5*S, wt = wallTop+0.7*S;
    ctx.fillStyle = '#87CEEB'; ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5;
    ctx.fillRect(wx, wt, ww, wh); ctx.strokeRect(wx, wt, ww, wh);
    ctx.beginPath(); ctx.moveTo(wx+ww/2, wt); ctx.lineTo(wx+ww/2, wt+wh); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(wx, wt+wh/2); ctx.lineTo(wx+ww, wt+wh/2); ctx.stroke();

    // Timber lines
    ctx.strokeStyle = '#c9a96e'; ctx.lineWidth = 0.5;
    for (let h = 0.3; h < wallH; h += 0.3) {
      ctx.beginPath(); ctx.moveTo(ox, wallTop+h*S); ctx.lineTo(ox+bw, wallTop+h*S); ctx.stroke();
    }

    dim(ctx, ox, groundY, ox+bw, groundY, '3.0 м', 25);
    dim(ctx, ox, wallTop, ox, groundY, '2.5', -25);
    ctx.fillStyle = '#555'; ctx.font = '10px Arial'; ctx.textAlign = 'center';
    ctx.fillText('С', ox-30, oy+80); ctx.fillText('Ю', ox+bw+30, oy+80);
  });

  // Facades title
  ctx.fillStyle = '#555'; ctx.font = '11px Arial'; ctx.textAlign = 'center';
  ctx.fillText('* Односкатная кровля: высокий конёк на западе (гараж), низкий на востоке (баня)', 450, 410);
}

// ============================================================
// 3D VIEW (Three.js)
// ============================================================
function init3D() {
  const container = document.getElementById('threejs-container');
  const W = container.clientWidth, H = container.clientHeight;

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(W, H);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setClearColor(0x1a1a2e);
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x1a1a2e, 0.03);

  const camera = new THREE.PerspectiveCamera(45, W/H, 0.1, 100);
  camera.position.set(10, 8, 12);
  camera.lookAt(3, 1.5, 2.5);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(3, 1.5, 2.5);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.update();

  // Lights
  const ambient = new THREE.AmbientLight(0xfff8e0, 0.6);
  scene.add(ambient);
  const sun = new THREE.DirectionalLight(0xffeedd, 1.2);
  sun.position.set(8, 12, 6);
  sun.castShadow = true;
  sun.shadow.mapSize.width = 2048;
  sun.shadow.mapSize.height = 2048;
  sun.shadow.camera.left = -15;
  sun.shadow.camera.right = 15;
  sun.shadow.camera.top = 15;
  sun.shadow.camera.bottom = -15;
  scene.add(sun);
  scene.add(new THREE.DirectionalLight(0x8888ff, 0.3).position.set(-5, 5, -5) && sun);

  // Axes
  scene.add(new THREE.AxesHelper(3));

  // Ground
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 40),
    new THREE.MeshLambertMaterial({ color: 0x3d5a3e })
  );
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Grid
  const grid = new THREE.GridHelper(40, 80, 0x2a4a2a, 0x2a4a2a);
  grid.position.y = 0.01;
  scene.add(grid);

  // Materials
  const woodMat = new THREE.MeshLambertMaterial({ color: 0xc8903a });
  const roofMat = new THREE.MeshLambertMaterial({ color: 0x5a5a6a });
  const floorMat = new THREE.MeshLambertMaterial({ color: 0xa08060 });
  const windowMat = new THREE.MeshLambertMaterial({ color: 0x87CEEB, transparent: true, opacity: 0.6 });
  const doorMat = new THREE.MeshLambertMaterial({ color: 0x5D2E0C });
  const darkWoodMat = new THREE.MeshLambertMaterial({ color: 0x8B5E2A });

  // Building dimensions
  const GW = 3, GD = 5, SW = 3, SD = 3, WH = 2.5;
  // L-shape: Garage (0,0)-(3,5), Sauna (3,0)-(6,3)
  // In 3D: x=east, z=south(front), y=up
  // Garage: x=0..3, z=0..5
  // Sauna: x=3..6, z=2..5 (front-aligned, back-step)

  function makeWall(w, h, d, x, y, z, mat, rx=0, ry=0, rz=0) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    mesh.position.set(x, y, z);
    mesh.rotation.set(rx, ry, rz);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    return mesh;
  }

  const T = 0.15; // wall thickness

  // ---- GARAGE WALLS ----
  // Front wall (z=5): full width 3m, with ворота gap (0.4 to 2.6)
  // Left of ворота: 0.4m wide
  makeWall(0.4, WH, T, 0.2, WH/2, GD, woodMat);
  // Right of ворота: 0.4m wide
  makeWall(0.4, WH, T, 2.8, WH/2, GD, woodMat);
  // Above ворота: from 2.2m to 2.5m height, 2.2m wide
  makeWall(2.2, 0.3, T, 1.5, 2.35, GD, woodMat);

  // Back wall (z=0): full width 3m
  makeWall(GW, WH, T, GW/2, WH/2, 0, woodMat);

  // Left wall (x=0): full depth 5m
  makeWall(T, WH, GD, 0, WH/2, GD/2, woodMat);

  // Right wall (x=3, garage side) — partial: z=0 to z=2 (sauna rear), full height
  // And z=2 to z=5 = shared wall with sauna, has internal door
  // Rear part (no opening): z=0 to z=2
  makeWall(T, WH, 2, 3, WH/2, 1, woodMat);
  // Front part with internal door: z=2 to z=5, door at z=4.0 to z=4.8
  makeWall(T, WH, 1.8, 3, WH/2, 2.9, woodMat); // above door region
  makeWall(T, 0.5, 0.8, 3, 2.25, 4.4, woodMat); // above door
  makeWall(T, WH, 0.6, 3, WH/2, 4.7, woodMat); // south of door

  // ---- GARAGE FLOOR ----
  const garageFloor = new THREE.Mesh(
    new THREE.BoxGeometry(GW, 0.1, GD),
    floorMat
  );
  garageFloor.position.set(GW/2, -0.05, GD/2);
  garageFloor.receiveShadow = true;
  scene.add(garageFloor);

  // ---- SAUNA WALLS ----
  // Front wall (z=5): sauna width x=3..6, external door at x=3.2 to 4.1
  makeWall(0.2, WH, T, 3.1, WH/2, GD, woodMat);
  makeWall(1.9, WH, T, 5.05, WH/2, GD, woodMat);
  makeWall(0.9, 0.5, T, 3.65, 2.25, GD, woodMat); // above door

  // Back wall of sauna (z=2): x=3..6
  makeWall(SW, WH, T, 4.5, WH/2, 2, woodMat);

  // Right wall (x=6): full depth 3m (z=2..5)
  makeWall(T, WH, SD, 6, WH/2, 3.5, woodMat);

  // Internal sauna walls (partition between rooms)
  // Парилка/Моечная divider: z=4.1
  makeWall(SW, WH, T, 4.5, WH/2, 4.1, darkWoodMat);
  // Моечная/Санузел divider: z=3.4, x=3..6
  makeWall(SW, WH, T, 4.5, WH/2, 3.4, darkWoodMat);
  // Санузел divider: x=4.2, z=2..3.4
  makeWall(T, WH, 1.4, 4.2, WH/2, 2.7, darkWoodMat);

  // ---- SAUNA FLOOR ----
  const saunaFloor = new THREE.Mesh(
    new THREE.BoxGeometry(SW, 0.1, SD),
    new THREE.MeshLambertMaterial({ color: 0x9a7050 })
  );
  saunaFloor.position.set(4.5, -0.05, 3.5);
  saunaFloor.receiveShadow = true;
  scene.add(saunaFloor);

  // ---- ROOF (single slope: high west x=0, low east x=6) ----
  // Roof height: at x=0 → y = WH + 0.8, at x=6 → y = WH
  // Create a tapered/sloped panel
  // Use a BufferGeometry trapezoid
  const roofH = 0.8; // height drop over 6m
  const roofGeo = new THREE.BufferGeometry();
  // Roof covers: garage x=0..3 z=0..5, sauna x=3..6 z=2..5
  // Simplified: cover bounding box x=0..6, z=0..5, slope in x direction
  // Front overhang: z = 5 + 0.3, back: garage z=0-0.3, sauna z=2
  // Vertices for L-shaped sloped roof (12 vertices for 2 quads?)
  // Garage roof quad: (0, WH+roofH, -0.3), (3, WH+roofH*0.5, -0.3), (3, WH+roofH*0.5, 5.3), (0, WH+roofH, 5.3)
  // Sauna roof quad: (3, WH+roofH*0.5, 2-0.3), (6, WH, 2-0.3), (6, WH, 5.3), (3, WH+roofH*0.5, 5.3)
  const rH = WH + roofH; // 3.3
  const rM = WH + roofH/2; // 2.9 (at x=3)
  const rL = WH; // 2.5 (at x=6)

  // Garage roof
  const garRoofGeo = new THREE.BufferGeometry();
  const garRoofVerts = new Float32Array([
    0, rH, -0.3,   3, rM, -0.3,   3, rM, 5.3,
    0, rH, -0.3,   3, rM, 5.3,    0, rH, 5.3,
  ]);
  garRoofGeo.setAttribute('position', new THREE.BufferAttribute(garRoofVerts, 3));
  garRoofGeo.computeVertexNormals();
  const garRoof = new THREE.Mesh(garRoofGeo, roofMat);
  garRoof.castShadow = true;
  scene.add(garRoof);

  // Sauna roof
  const sauRoofGeo = new THREE.BufferGeometry();
  const sauRoofVerts = new Float32Array([
    3, rM, 1.7,   6, rL, 1.7,   6, rL, 5.3,
    3, rM, 1.7,   6, rL, 5.3,   3, rM, 5.3,
  ]);
  sauRoofGeo.setAttribute('position', new THREE.BufferAttribute(sauRoofVerts, 3));
  sauRoofGeo.computeVertexNormals();
  const sauRoof = new THREE.Mesh(sauRoofGeo, roofMat);
  sauRoof.castShadow = true;
  scene.add(sauRoof);

  // Roof fascia (front edge)
  makeWall(6.2, 0.2, 0.05, 3, rH - 0.4*roofH, 5.35, new THREE.MeshLambertMaterial({color: 0x6b6b6b}));

  // ---- WINDOWS (visual boxes) ----
  // Garage left wall windows
  const winMesh1 = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.8, 0.8), windowMat);
  winMesh1.position.set(0, 1.7, 2.0); scene.add(winMesh1);
  const winMesh2 = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.8, 0.8), windowMat);
  winMesh2.position.set(0, 1.7, 3.5); scene.add(winMesh2);

  // ---- DOORS (visual) ----
  // Garage ворота (left leaf)
  const gateL = new THREE.Mesh(new THREE.BoxGeometry(0.05, 2.2, 1.1), doorMat);
  gateL.position.set(0.95, 1.1, 5.02); scene.add(gateL);
  // (right leaf slightly open)
  const gateR = new THREE.Mesh(new THREE.BoxGeometry(0.05, 2.2, 1.1), doorMat);
  gateR.position.set(2.05, 1.1, 5.02); scene.add(gateR);

  // Sauna door
  const sauDoor = new THREE.Mesh(new THREE.BoxGeometry(0.05, 2.0, 0.9), doorMat);
  sauDoor.position.set(3.65, 1.0, 5.02); scene.add(sauDoor);

  // ---- FURNITURE (simplified 3D) ----
  // Workbench at z=0 (north) garage
  const bench = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.08, 0.6),
    new THREE.MeshLambertMaterial({color: 0xd4a373}));
  bench.position.set(1.5, 0.85, 0.3);
  bench.castShadow = true; scene.add(bench);
  const benchLegs = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.85, 0.6),
    new THREE.MeshLambertMaterial({color: 0xa0764d}));
  benchLegs.position.set(1.5, 0.425, 0.3); scene.add(benchLegs);

  // Shelves on x=3 wall (garage side)
  const shelf = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.8, 0.25),
    new THREE.MeshLambertMaterial({color: 0xdeb887}));
  shelf.position.set(2.85, 0.9+0.7, 1.6); scene.add(shelf);

  // Sauna stove
  const stove = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.7, 0.5),
    new THREE.MeshLambertMaterial({color: 0x555555}));
  stove.position.set(3.25, 0.35, 4.25); scene.add(stove);

  // Sauna benches (парилка)
  const bench2 = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.08, 0.35),
    new THREE.MeshLambertMaterial({color: 0xc8956c}));
  bench2.position.set(4.5+0.1, 0.55, 4.4); scene.add(bench2);
  const bench3 = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.08, 0.35),
    new THREE.MeshLambertMaterial({color: 0xc8956c}));
  bench3.position.set(4.5+0.1, 1.0, 4.7); scene.add(bench3);

  // Motorcycle outline
  const moto = new THREE.Mesh(
    new THREE.BoxGeometry(0.9, 1.0, 2.4),
    new THREE.MeshLambertMaterial({ color: 0x3a3a3a, wireframe: true })
  );
  moto.position.set(0.8, 0.5, 2.5); scene.add(moto);

  // Labels (HTML overlay)
  const labelStyle = `position:absolute;background:rgba(26,26,46,0.85);color:#e94560;
    padding:3px 8px;border-radius:3px;font:12px sans-serif;pointer-events:none;white-space:nowrap;`;

  function addLabel(text, pos3d) {
    const div = document.createElement('div');
    div.style.cssText = labelStyle;
    div.textContent = text;
    div.dataset.pos = JSON.stringify(pos3d);
    container.style.position = 'relative';
    container.appendChild(div);
    return div;
  }

  const labels = [
    addLabel('Гараж', {x:1.5, y:2.0, z:2.5}),
    addLabel('Парилка', {x:4.5, y:1.5, z:4.7}),
    addLabel('Моечная', {x:4.5, y:1.5, z:3.7}),
    addLabel('Санузел', {x:3.6, y:1.5, z:2.7}),
  ];

  function updateLabels() {
    const vp = new THREE.Vector3();
    labels.forEach(lbl => {
      const p = JSON.parse(lbl.dataset.pos);
      vp.set(p.x, p.y, p.z).project(camera);
      const x = (vp.x + 1) / 2 * W;
      const y = (-vp.y + 1) / 2 * H;
      if (vp.z < 1) {
        lbl.style.left = (x - lbl.offsetWidth/2) + 'px';
        lbl.style.top = (y - 10) + 'px';
        lbl.style.display = 'block';
      } else {
        lbl.style.display = 'none';
      }
    });
  }

  // Info overlay
  const info = document.createElement('div');
  info.style.cssText = `position:absolute;top:10px;right:10px;background:rgba(26,26,46,0.85);
    color:#a0aec0;padding:10px 14px;border-radius:6px;font:11px sans-serif;line-height:1.7;`;
  info.innerHTML = `<b style="color:#e94560">Управление:</b><br>
    ЛКМ — поворот<br>ПКМ — панорама<br>
    Колёсико — масштаб<br>
    <hr style="border-color:#333;margin:6px 0">
    <b style="color:#e94560">Объект:</b><br>
    Г-образное здание<br>Гараж 3×5 м<br>Баня 3×3 м<br>Односкатная кровля<br>Каркасная конструкция`;
  container.style.position = 'relative';
  container.appendChild(info);

  // Animation loop
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
    updateLabels();
  }
  animate();

  // Resize
  window.addEventListener('resize', () => {
    const nW = container.clientWidth, nH = container.clientHeight;
    camera.aspect = nW/nH;
    camera.updateProjectionMatrix();
    renderer.setSize(nW, nH);
  });
}

// Init
drawFloorPlan();
</script>
</body>
</html>
